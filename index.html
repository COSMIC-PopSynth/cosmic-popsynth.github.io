<!DOCTYPE html>
<html lang="en">
  <head>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link media="all" href="css/pygments.css" type="text/css" rel="stylesheet" />
    <link media="all" href="css/gwpy.css" type="text/css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-fork-ribbon-css/0.2.3/gh-fork-ribbon.min.css" />
    <script src="js/https.js" type="text/javascript"></script>
    <script src="//netdna.bootstrapcdn.com/bootstrap/3.0.0/js/bootstrap.min.js" type="text/javascript"></script>
    <title>COSMIC</title>
    <link rel="shortcut icon" href="images/cosmic-favicon.ico"/>
    <style>
        .github-fork-ribbon:before { background-color: #333; }

        .btn-blue {
            background-color: #5788b6!important;
            border: 0;
        }
        .btn-blue:hover {
            background-color: #406b8c!important;
        }
        .btn-pink {
            background-color: #d83394!important;
            border: 0;
        }
        .btn-pink:hover {
            background-color: #c22b80!important;
        }
    </style>
  </head>
  <body>
    <a class="github-fork-ribbon" href="https://github.com/COSMIC-PopSynth/COSMIC" data-ribbon="Fork me on GitHub" title="Fork me on GitHub">Fork me on GitHub</a>
    <div class="container mt-5">
      <div id="logo">
        <img src="images/cosmic-colour.png" alt="COSMIC logo" title="COSMIC logo" style="width: 100%; max-width: 1000px"/>
        <p class="mb-2" id="tagline">a python package for binary population synthesis</p>
        <p>
            <a href="https://doi.org/10.5281/zenodo.3482915"><img src="https://zenodo.org/badge/DOI/10.5281/zenodo.3482915.svg" alt="DOI"></a>
            <a href="http://badge.fury.io/py/cosmic-popsynth" target="_blank"><img src="https://badge.fury.io/py/cosmic-popsynth.svg" /></a>
            <a href="https://travis-ci.org/COSMIC-PopSynth/COSMIC" target="_blank"><img src="https://travis-ci.org/COSMIC-PopSynth/COSMIC.svg?branch=develop" /></a>
            <a href="https://codecov.io/gh/COSMIC-PopSynth/COSMIC" target="_blank"><img src="https://codecov.io/gh/COSMIC-PopSynth/COSMIC/branch/develop/graph/badge.svg" /></a>
        </p>
      </div>
      <div class="row justify-content-center">
        <div class="col-12 col-md-9">
            <div class="doclinks">
                <div class="row">
                <div class="col-md-6">
                    <a href="docs/stable/" title="COSMIC docs (latest release)"><button type="button" class="btn btn-default btn-success btn-blue docs">Stable (v3.6.1)</button></a>
                </div>
                <div class="col-md-6">
                    <a href="https://cosmic-popsynth.github.io/COSMIC/" title="COSMIC development docs (HEAD)"><button type="button" class="btn btn-default btn-success btn-pink docs" id="develop branch">Latest</button></a>
                </div>
                </div>
            </div>
            <p>If you don't see your version of COSMIC listed here, chances are support for it has dropped. You should consider updating your installation, which can be done with pip:</p>
            <pre style="background: #333; padding: 1rem; border-radius: 10px; color: white;}">$ pip install --upgrade cosmic-popsynth</pre>
        </div>
      </div>
    </div>
  </body>
</html>
